# Weekly pull requests for npm packages and the pinned GitHub Actions, so
# security fixes arrive without hand-checking every dependency.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
